# Starter file. Add your own services (your app, Postgres) next to payswift. Leave payswift as it is.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PAYSWIFT_BASE_URL: http://payswift:8081
      DATABASE_URL: postgresql://qdwork:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/qdwork
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      payswift:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qdwork
      POSTGRES_USER: qdwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qdwork -d qdwork"]
      interval: 5s
      timeout: 5s
      retries: 5

  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

volumes:
  postgres_data:
